services:
  - type: web
    name: the-perfect-swarm
    env: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SWARM_APP_TOKENS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false

  - type: cron
    name: swarm-morning-slate
    env: node
    schedule: "0 11 * * *" # Daily 11:00 UTC = 06:00 AM America/Chicago
    buildCommand: npm install
    startCommand: "node scripts/morning-cron.mjs"
    envVars:
      - key: NODE_ENV
        value: production
      - key: SWARM_BASE_URL
        value: https://the-perfect-swarm.onrender.com
      - key: SWARM_APP_TOKEN
        sync: false
